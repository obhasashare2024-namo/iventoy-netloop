# Nginx Reference Configuration for HTTP 206 Byte-Range NetLoop Server
server {
    listen 26001;
    server_name _;

    root /run/media/namobuddha/2tbnvV;

    location /iso/ {
        alias /run/media/namobuddha/2tbnvV/;
        
        # Crucial for GRUB HTTP 206 Loopback
        max_ranges 512;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Disable gzip compression so Byte-Range offsets remain verbatim 1:1
        gzip off;

        add_header Accept-Ranges bytes;
        autoindex on;
    }
}
