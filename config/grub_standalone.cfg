# Embedded standalone initialization config
set timeout=0
set default=0

# Fetch primary network config via DHCP
echo "Acquiring network configuration..."
net_dhcp

# Chainload external dynamic menu from server
if [ -n "$net_default_server" ]; then
    echo "Loading dynamic menu from ${net_default_server}..."
    configfile (tftp)/boot/grub/grub.cfg
else
    echo "Network server not detected, dropping to rescue..."
fi
