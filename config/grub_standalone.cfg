# Embedded standalone initialization config

echo "Acquiring network configuration..."
net_dhcp

if [ -z "$net_default_server" ]; then
    set net_default_server=$net_efinet0_dhcp_next_server
fi
if [ -z "$net_default_server" ]; then
    set net_default_server=192.168.122.1
fi

echo "Loading dynamic menu from ${net_default_server}:26001..."
configfile (http,${net_default_server}:26001)/grub/grub.cfg
echo "Dynamic menu finished or exited. Dropping to shell..."
