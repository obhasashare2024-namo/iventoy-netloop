# Embedded standalone initialization config
insmod serial
insmod terminal
serial --unit=0 --speed=115200
terminal_output console serial
terminal_input console serial

insmod http
insmod loopback
insmod part_gpt
insmod ext2
insmod linux

echo "Acquiring network configuration..."
net_dhcp

set net_default_server=192.168.122.1

echo "Loading dynamic config from ${net_default_server}:26001..."
configfile (http,${net_default_server}:26001)/grub/grub.cfg
echo "Dynamic config finished or exited. Dropping to shell..."
